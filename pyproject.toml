[project]
name = "mfl-brain"
version = "0.1.0"
description = "Local-first AI second brain for an MFL teacher (French/Spanish)"
requires-python = ">=3.12"
dependencies = [
  "ollama",
  "pyyaml",
  "python-docx",
  "python-pptx",
  "pypdf",
  "openpyxl",
  "sqlite-vec",
  "rich",
]

[project.optional-dependencies]
apple = ["apple-fm-sdk"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfl_brain"]
